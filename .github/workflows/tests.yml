name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-chat:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-cache-dir -r requirements.lock.txt
      - run: python setup_memory.py
      - name: Real isolated Ombre lifecycle recovery
        env:
          OMBRE_RUNTIME_GATE: '1'
        run: python -m unittest tests.test_ombre_runtime_recovery_live -v
      - run: python veil_agent.py --help
      - run: python -m unittest discover -s tests -v
